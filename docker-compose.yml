services:
  postgres:
    image: postgres:17-alpine
    container_name: wepay-postgres
    environment:
      POSTGRES_DB: wepay
      POSTGRES_USER: wepay
      POSTGRES_PASSWORD: wepay1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wepay -d wepay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: wepay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: wepay-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: wepay-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      # - '--storage.tsdb.retention.time=15d' # 데이터 저장 정책 설정 예시 (필요시 주석 해제)
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - redis_exporter

  grafana:
    image: grafana/grafana:latest
    container_name: wepay-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    container_name: wepay-k6
    volumes:
      - ./load-tests:/scripts
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),avg,max
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - loadtest
    entrypoint: ["k6", "run", "-o", "prometheus-rw", "/scripts/stampeding-herd.js"]

volumes:
  postgres_data:
  grafana_data:
