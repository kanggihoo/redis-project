spring:
  application:
    name: wepay

  datasource:
    url: jdbc:postgresql://localhost:5432/wepay
    username: wepay
    password: wepay1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

cache:
  account:
    ttl-seconds: 60

rate-limit:
  transfer:
    max-requests: 5
    window-seconds: 60
  account-read:
    max-requests: 100
    window-seconds: 60

jwt:
  secret: wepay-phase3-test-secret-key-minimum-256-bits-long-enough
  expiration-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
